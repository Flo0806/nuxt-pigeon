name: Docs

# Two ways in, on purpose:
#   - a `docs-v*` tag, which is what `scripts/release.sh docs` pushes
#   - by hand from the Actions tab, for a rebuild without a version bump
on:
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-docs

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `docs-v1.2.3` becomes `1.2.3`. A manual run has no tag, so it only gets
      # `latest` and the commit sha.
      - name: Read the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/docs-v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/docs-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.value != '' }}
            type=sha,prefix=

      # The context is the repository root: the docs are a workspace member and the
      # build needs the lockfile next to them.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          {
            echo "### Docs image pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "On server02: \`docker compose pull docs && docker compose up -d docs\`"
          } >> "$GITHUB_STEP_SUMMARY"
